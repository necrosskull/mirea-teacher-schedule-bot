[project]
name = "schedule-bot"
version = "0.1.0"
description = ""
authors = [{ name = "Slava Kuryaev", email = "92830706+necrosskull@users.noreply.github.com" }]
requires-python = ">=3.11,<4"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "aiogram>=3.13,<4",
    "aiosqlite>=0.20,<1",
    "dishka>=1.4,<2",
    "httpx>=0.26,<1",
    "python-dotenv>=1.0.0,<2",
    "pydantic>=2.11,<3",
    "fastapi>=0.110,<1",
    "uvicorn>=0.28,<1",
]


[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::pytest.PytestUnhandledThreadExceptionWarning",
    "ignore::ResourceWarning",
]




[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"

